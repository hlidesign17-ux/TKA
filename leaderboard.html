<!doctype html>
<html>
  <head>
    <title>Leaderboard</title>
    <link rel="stylesheet" href="leaderboard.css" />
  </head>

  <body>
    <div class="container">
      <h1>🏆 Leaderboard</h1>

      <select id="jenjang">
        <option value="SD">SD</option>
        <option value="SMP">SMP</option>
      </select>

      <select id="mapel">
        <option value="MTK">MTK</option>
        <option value="INDO">INDO</option>
      </select>

      <select id="bank">
        <option value="1">Bank 1</option>
        <option value="2">Bank 2</option>
        <option value="3">Bank 3</option>
        <option value="4">Bank 4</option>
        <!-- tambah -->
        <option value="5">Bank 5</option>
        <!-- tambah -->
      </select>

      <button id="btnLoad" onclick="loadLeaderboard()">Tampilkan</button>

      <table id="tabel">
        <tr>
          <th>Rank</th>
          <th>Username</th>
          <th>Nilai</th>
          <th>Waktu</th>
        </tr>
      </table>
    </div>

    <div
      id="loadingOverlay"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 20px;
        z-index: 999;
      "
    >
      Memuat leaderboard...
    </div>

    <script src="leaderboard.js"></script>
  </body>
</html>
